AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Trading card catalog starter app - Java Lambda + DynamoDB + HTTP API

Globals:
  Function:
    Runtime: java21
    Architectures:
      - x86_64
    MemorySize: 1024
    Timeout: 20
    Environment:
      Variables:
        TABLE_NAME: !Ref CardCatalogTable
        ALLOWED_ORIGIN: '*'

Resources:
  CardCatalogApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowMethods: [GET, POST, PUT, DELETE, OPTIONS]
        AllowHeaders: [Content-Type, Authorization]
        AllowOrigins: ['*']

  CardCatalogFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: com.stabdan.cardcatalog.handler.ApiHandler::handleRequest
      CodeUri: build/libs/card-catalog-0.1.0-all.jar
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref CardCatalogTable
      Events:
        ProxyApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref CardCatalogApi
            Path: /{proxy+}
            Method: ANY
        RootApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref CardCatalogApi
            Path: /
            Method: ANY

  CardCatalogTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE

Outputs:
  ApiUrl:
    Description: HTTP API endpoint
    Value: !Sub "https://${CardCatalogApi}.execute-api.${AWS::Region}.amazonaws.com"
