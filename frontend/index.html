<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Card Catalog</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
<header>
  <h1>Card Catalog</h1>
  <p>Personal trading card inventory built around sets, checklists, and owned copies.</p>
</header>

<main>
  <section class="panel">
    <h2>API Settings</h2>
    <label>API Base URL
      <input id="apiBase" placeholder="https://your-api.execute-api.us-east-1.amazonaws.com" />
    </label>
    <button id="saveApiBase">Save API URL</button>
    <span id="apiStatus"></span>
  </section>

  <section class="grid">
    <form id="setForm" class="panel">
      <h2>1. Add Set</h2>
      <input name="name" placeholder="2003-04 Upper Deck Finite" required />
      <input name="sportOrGame" placeholder="Basketball / MTG / Football" />
      <input name="manufacturer" placeholder="Upper Deck" />
      <div class="two">
        <input name="yearStart" type="number" placeholder="2003" />
        <input name="yearEnd" type="number" placeholder="2004" />
      </div>
      <textarea name="notes" placeholder="Notes"></textarea>
      <button>Add Set</button>
    </form>

    <form id="checklistForm" class="panel">
      <h2>2. Add Checklist Card</h2>
      <label>Set
        <select id="checklistSetId" name="setId" required></select>
      </label>
      <div class="two">
        <input name="cardNumber" placeholder="16" required />
        <input name="playerOrSubject" placeholder="Michael Jordan" />
      </div>
      <div class="two">
        <input name="team" placeholder="Bulls" />
        <input name="subset" placeholder="Finite / Gold / Jersey" />
      </div>
      <input name="serialMax" type="number" placeholder="Out of, if normally serialized" />
      <textarea name="notes" placeholder="Checklist notes"></textarea>
      <button>Add Checklist Card</button>
    </form>
  </section>

  <section class="panel">
    <h2>3. Add Owned Copy</h2>
    <p class="muted">Owned cards must point to a set and a checklist card already entered above.</p>
    <form id="cardForm">
      <div class="two">
        <label>Set
          <select id="ownedSetId" name="setId" required></select>
        </label>
        <label>Checklist Card
          <select id="ownedCardNumber" name="cardNumber" required></select>
        </label>
      </div>
      <div class="two">
        <input name="condition" placeholder="Raw NM / PSA 9 / BGS 9.5" />
        <input name="photoUrl" placeholder="Photo URL for now" />
      </div>
      <div class="two">
        <input name="serialNumber" type="number" placeholder="Actual serial #" />
        <input name="serialMax" type="number" placeholder="Override out of, optional" />
      </div>
      <div class="two">
        <input name="purchasePrice" placeholder="$48 shipped" />
        <input name="storageLocation" placeholder="Box / shelf / vault location" />
      </div>
      <div class="two">
        <input name="acquiredFrom" placeholder="eBay / COMC / Burbank" />
        <input name="acquiredDate" placeholder="2026-05-14" />
      </div>
      <textarea name="notes" placeholder="Swatch color, pop notes, flaws, etc."></textarea>
      <button>Add Owned Card</button>
    </form>
  </section>

  <section class="panel">
    <div class="row">
      <h2>Sets & Checklists</h2>
      <button id="refreshSets">Refresh</button>
    </div>
    <label>View checklist for set
      <select id="viewSetId"></select>
    </label>
    <div id="sets" class="sets"></div>
    <h3>Checklist</h3>
    <div id="checklist" class="cards"></div>
  </section>

  <section class="panel">
    <div class="row">
      <h2>Owned Cards</h2>
      <button id="refreshCards">Refresh</button>
    </div>
    <input id="cardFilter" placeholder="Filter by player, set, number, condition..." />
    <div id="cards" class="cards"></div>
  </section>
</main>

<script src="app.js"></script>
</body>
</html>
